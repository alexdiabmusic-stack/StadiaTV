name: Landmark Orléans browser test (no Firecrawl)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/landmark-probe.yml'

permissions:
  contents: read
  issues: write

jobs:
  test-landmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright browser
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Render the actual date-filtered showtimes
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs
          import traceback

          report=['# Landmark Orléans Playwright browser test','', 'Chromium rendered the showtimes page without Firecrawl.','']
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True, args=['--no-sandbox'])
                  page=browser.new_page(locale='en-CA', viewport={'width':1366,'height':900})
                  response=page.goto('https://www.landmarkcinemas.com/showtimes/orleans',timeout=50000,wait_until='domcontentloaded')
                  page.wait_for_timeout(2500)
                  report.extend([f'HTTP status: {response.status if response else "none"}',f'Document title: {page.title()}',f'HTML characters: {len(page.content())}'])
                  dropdown=page.locator('select#Dates')
                  report.append(f'Date selector count: {dropdown.count()}')
                  if dropdown.count():
                      options=dropdown.locator('option').evaluate_all('(items) => items.map(x => ({value:x.value, label:x.textContent.trim()})).filter(x => x.value.includes("2026-12-17") || x.label.includes("December 17"))')
                      report.append('Matching date options: '+str(options))
                      if options: dropdown.select_option(value=options[0]['value'])
                      page.wait_for_timeout(1200)
                  matches=page.locator('a[data-session-booking-btn][title*="Avengers: Doomsday"][title*="Thursday, December 17"]')
                  report.append(f'December 17 Doomsday anchors in DOM: {matches.count()}')
                  rows=[]
                  for a in matches.all():
                      href=a.get_attribute('href') or ''
                      url=urljoin(page.url,href)
                      q=parse_qs(urlparse(url).query)
                      if q.get('cinemaId',[''])[0]!='193':continue
                      title=a.get_attribute('title') or ''
                      rows.append({'id':q.get('sessionId',[''])[0], 'time':title.split(' at ')[-1], 'format':title.split(' on Thursday, December 17 at ')[0], 'url':url, 'visible':a.is_visible()})
                  visible=[r for r in rows if r['visible']]
                  report.append(f'Visibly displayed December 17 sessions: {len(visible)}')
                  for row in sorted(visible,key=lambda x:x['time']):
                      report.append(f"- {row['time']} — {row['format']} — {row['id']} — {row['url']}")
                  baseline={'11519167','11519168','11528446','11528447','11528448'}
                  seen={r['id'] for r in visible}
                  report.extend(['',f'All five known baseline sessions visible: {baseline.issubset(seen)}',f'Unexpected new visible session IDs: {sorted(seen-baseline)}',f'December 17 6:45 PM visible? {any(r["time"].lower()=="6:45 pm" for r in visible)}'])
                  browser.close()
          except Exception as e:
              report.append('PROBE ERROR: '+repr(e))
              traceback.print_exc()
          out='\n'.join(report)
          print(out)
          Path('/tmp/landmark_probe_report.md').write_text(out)
          PY
      - name: Publish result as an issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/landmark_probe_report.md ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "Landmark browser probe result" --body-file /tmp/landmark_probe_report.md
          fi
